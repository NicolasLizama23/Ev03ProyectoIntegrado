databases:
  - name: iconstruction-db
    databaseName: iconstruction
    user: iconstruction_user

services:
  - type: web
    name: iconstruction
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn iconstruction_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iconstruction-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4